name: treasurehunter
description: Caça ao Tesouro PWA para crianças.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # Image handling
  image_picker: ^1.1.2
  image_picker_for_web: ^3.0.5

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Routing
  go_router: ^14.2.7

  # State management
  provider: ^6.1.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
